<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My keys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0e11;
  --c1:#141820;
  --c2:#1a2030;
  --c3:#232d40;
  --bdr:#2e3848;
  --t:#e2e6ec;
  --t2:#8090a8;
  --blu:#4da0f8;
  --grn:#3dcc6e;
  --org:#eba830;
  --red:#e8554e;
  --pur:#a88cf8;
  --cyn:#38d4c2;
}
body{background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;line-height:1.5}

/* Buttons */
.btn{
  padding:7px 18px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  border:none;
  font-weight:600;
  font-family:inherit;
  transition:all .2s;
  letter-spacing:.3px;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-grn{background:var(--grn);color:#fff}
@keyframes invitePulse{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--grn)}}
.card.invite-flash{animation:invitePulse 1.1s ease 2}
.btn-grn:hover:not(:disabled){background:#45d676;box-shadow:0 4px 12px rgba(61,204,110,.3)}
.btn-blu{background:var(--blu);color:#fff}
.btn-blu:hover:not(:disabled){background:#5eadf9;box-shadow:0 4px 12px rgba(77,160,248,.3)}
.btn-red{background:var(--red);color:#fff;padding:4px 12px;font-size:10px}
.btn-red:hover:not(:disabled){background:#ec6b65;box-shadow:0 4px 12px rgba(232,85,78,.3)}
.btn-outline{background:transparent;color:var(--t2);border:1px solid var(--bdr);padding:4px 12px;font-size:10px}
.btn-outline:hover:not(:disabled){border-color:var(--blu);color:var(--t);background:var(--c2)}

.tbl-input{width:100%;background:var(--c2);border:1px solid var(--bdr);color:var(--t);padding:4px 8px;border-radius:4px;font-size:11px;font-family:inherit;outline:none;transition:border-color .2s}
.tbl-input:focus{border-color:var(--blu)}
.tbl-input::placeholder{color:var(--t2);opacity:.6}
.appbar{display:flex;align-items:center;gap:16px;padding:11px 18px;background:var(--c1,#141820);border-bottom:1px solid var(--bdr,#232b3b);flex-wrap:wrap;margin:-20px -40px 16px -40px}
.appbar .logo{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;color:var(--t,#e2e6ec);padding-left:4px}
.appbar .logo em{font-style:normal;color:var(--blu,#4da0f8)}
.appbar nav{display:flex;gap:2px;flex-wrap:wrap}
.appbar nav a{padding:5px 11px;border-radius:7px;color:var(--t2,#8090a8);font-size:13px;text-decoration:none}
.appbar nav a:hover{background:var(--c2,#1a2030);color:var(--t,#e2e6ec)}
.appbar nav a.on{background:var(--c2,#1a2030);color:var(--t,#e2e6ec);font-weight:600}
.appbar .ab-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ab-user{color:var(--grn,#3dcc6e);font-size:13px;font-weight:600}
.ab-user .role{color:var(--t2,#8090a8);font-weight:400}
.ab-out{color:var(--red,#e8554e);border:1px solid var(--bdr,#232b3b);border-radius:7px;padding:4px 11px;font-size:13px;text-decoration:none}
.ab-out:hover{border-color:var(--red,#e8554e)}
.pg{max-width:1800px;margin:auto;padding:20px 40px}.card{background:var(--c1);border:1px solid var(--bdr);border-radius:10px;padding:20px;margin:20px 0}.page-title{font-size:18px;font-weight:700}h2{font-size:15px;margin-bottom:12px}p{color:var(--t2);margin:10px 0}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:16px 0}label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;color:var(--t2)}.tbl-input{width:240px;min-height:34px}.btn{min-height:34px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#keys p{padding:10px 0;border-bottom:1px solid var(--bdr)}#keys button{margin-left:14px}@media(max-width:600px){.pg{padding:16px}.tbl-input{width:100%}}</style>
<div class="pg"><header class="appbar">
<a class="logo" href="/dashboard">Price<em>Tag</em></a>
<nav><a href="/management" class="on">My keys</a><a href="/dashboard">Usage</a><a href="/manager" id="tab-team" hidden>My team</a><a href="/admin" id="tab-admin" hidden>Admin</a></nav>
<div class="ab-right"><span class="ab-user" id="nav-user"></span><a href="/logout" class="ab-out">Sign out</a></div>
</header>
<h1 class="page-title">My keys</h1><p id="identity">Loading identity…</p><p>Keys are shown only when created. Store them privately. Administration is available on the Administration page.</p>
<section class="card"><h2>Key lifecycle</h2><form id="key"><label>Name <input class="tbl-input" name="name" required maxlength="128"></label><label>Lifetime <input class="tbl-input" name="expiresIn" value="30d" required></label><button class="btn btn-grn">Create key</button></form><button class="btn btn-outline" id="listKeys">List my keys</button><div id="keys"></div><pre id="newKey"></pre></section>
<p role="status" id="status"></p>
</div>
<script>
'use strict';
const el=id=>document.getElementById(id);
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw new Error('Request failed: HTTP '+r.status);const text=await r.text();return text?JSON.parse(text):{};}
const values=form=>Object.fromEntries(new FormData(form));
function report(fn){return async event=>{if(event)event.preventDefault();el('status').textContent='Working…';try{await fn();el('status').textContent='Done';}catch(e){el('status').textContent=e.message;}};}
function bind(id,fn){el(id).addEventListener('submit',report(()=>fn(values(el(id)))));}
bind('key',async body=>{const result=await api('/me/keys','POST',body);el('newKey').textContent=JSON.stringify(result,null,2);});
el('listKeys').onclick=report(async()=>{const result=await api('/me/keys');el('newKey').textContent='';el('keys').replaceChildren();for(const key of result.data||[]){const row=document.createElement('p');row.textContent=[key.name,key.id,key.expiresAt||key.expirationDate||''].join(' — ');const b=document.createElement('button');b.textContent='Revoke';b.className='btn btn-outline';b.onclick=report(async()=>{await api('/me/keys/'+encodeURIComponent(key.id),'DELETE');row.remove();});row.append(b);el('keys').append(row);}});
report(async()=>{const who=await api('/api/v1/whoami');el('identity').textContent='Signed in as '+who.user;el('nav-user').textContent=who.user;el('tab-team').hidden=!who.isManager;el('tab-admin').hidden=!who.isSuperAdmin;if(who.impersonating){el('key').hidden=true;el('listKeys').hidden=true;}})();
</script></html>
